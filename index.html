   <section class="card"><div class="cardtitle">最近の訪問</div>${recent.length?recent.map(v=>{const m=byCode(v.code);return `<div class="record"><div class="ico done">✓</div><div><div class="mn">${esc(m?m.name:v.name)}</div><div class="mm">${esc(v.date)} · ${v.verification==="photo"?"写真あり":"ユーザー申告"}</div></div></div>`}).join(""):`<div class="empty">まだ訪問記録がありません。</div>`}</section></div>`;
 } else if(page==="list"){
   const prefs=[...new Set(MUNICIPALITIES.map(x=>x.pref))];
   main.innerHTML=`<div class="eyebrow">ALL 1,912 TARGETS</div><div class="title">自治体・行政区一覧</div><div class="sub">自治体名、都道府県、郡、市町村コードから検索できます。</div>
   <div class="searchrow"><input class="input" id="search" placeholder="自治体名などで検索" value="${esc(q)}"><select class="input" id="pref"><option value="">全国</option>${prefs.map(p=>`<option ${p===pref?"selected":""}>${esc(p)}</option>`).join("")}</select><select class="input" id="kind"><option value="">すべての区分</option>${["市","町","村","特別区","行政区"].map(k=>`<option ${k===kind?"selected":""}>${k}</option>`).join("")}</select></div>
   <section class="card" id="listResults"></section>`;
   renderListResults();
   const input=$("search");
   let composing=false;

   input.addEventListener("input",e=>{q=e.target.value;if(composing||e.isComposing)return;pageNo=1;renderListResults()});
   $("pref").onchange=e=>{pref=e.target.value;pageNo=1;renderListResults()};
   $("kind").onchange=e=>{kind=e.target.value;pageNo=1;renderListResults()};
 } else if(page==="records"){
   main.innerHTML=`<div class="eyebrow">YOUR TRAVEL LOG</div><div class="title">訪問記録</div><div class="sub">同じ自治体への再訪も履歴として残せます。</div><button class="btn primary" style="margin:15px 0" onclick="openModal()">＋ 訪問を記録</button><section class="card">${visits.length?visits.slice().reverse().map(v=>{const m=byCode(v.code);return `<div class="record"><div class="ico done">✓</div><div class="recordmain"><div class="mn">${esc(m?m.name:v.name)}</div><div class="mm">${m?esc(m.pref)+" · "+esc(m.type)+" · ":""}${esc(v.date)}${v.memo?" · "+esc(v.memo):""}</div><span class="tag">${v.verification==="photo"?"写真あり・位置情報未確認":"ユーザー申告"}</span></div><button class="action" onclick="delVisit('${v.id}')">削除</button></div>`}).join(""):`<div class="empty">訪問記録はまだありません。</div>`}</section>`;
 } else {

   const muniDone=done.size-adminDone;
   const tier=licenseTier(done.size);
   const nextTier=tier.next?licenseTier(tier.next):null;
   main.innerHTML=`<div class="eyebrow">MY PAGE</div><div class="title">マイページ</div>
   ${testModeControls()}
   <div class="license-wrap"><div class="license" data-tier="${tier.name.toLowerCase()}" aria-label="1912CITIES ${tier.name} エクスプローラーライセンス">
    <div class="license-head"><div><div class="license-logo">1912CITIES</div><div class="license-label">${tier.name} · EXPLORER LICENSE</div></div><div class="license-emblem">${tier.symbol}</div></div>
    <div><div class="license-caption">LICENSE HOLDER</div><div class="license-name">${esc(licenseName)}</div><div class="license-line"></div>
    <div class="license-numbers"><div><div class="license-num">${muniDone.toLocaleString()} <span style="font-size:.5em;font-weight:700;color:#d7e7fa">/ 1,741</span></div><div class="license-caption">市区町村</div></div><div><div class="license-num">${adminDone.toLocaleString()} <span style="font-size:.5em;font-weight:700;color:#d7e7fa">/ 171</span></div><div class="license-caption">行政区</div></div><div><div class="license-num">${done.size.toLocaleString()}</div><div class="license-caption">TOTAL / 1,912</div></div></div></div>
    <div class="license-foot"><div class="license-id">ID ${esc(licenseId)}</div><div class="license-label">SINCE ${formatLicenseSince(licenseSince)}</div></div>
   </div><div class="license-rank-info"><strong>${tier.name} LICENSE</strong><span>${tier.next?`次の ${nextTier.name} まであと ${(tier.next-done.size).toLocaleString()} 制覇`:"全国1,912対象を完全制覇！"}</span></div><div class="license-settings"><input id="licenseNameInput" class="input" maxlength="28" aria-label="ライセンス表示名" placeholder="表示名・ニックネーム" value="${esc(licenseName)}"><button class="btn primary" onclick="saveLicenseName()">名前を保存</button></div>
   <div class="license-settings"><label for="licenseSinceInput" style="font-size:12px;font-weight:800">SINCE（最初に制覇を始めた日）</label><input id="licenseSinceInput" class="input" type="date" value="${esc(licenseSince)}"><button class="btn primary" onclick="saveLicenseSince()">日付を保存</button></div>
   <div class="note">ライセンスは1912CITIES内の個人用カードです。表示名・開始日・IDはこの端末に保存されます。画面のスクリーンショットで保存できます。</div></div>
   <section class="license-preview-section" aria-label="全14ランクのデザイン確認"><button id="licensePreviewToggle" type="button" class="btn" aria-controls="licensePreviewGallery" aria-expanded="false" onclick="toggleLicensePreview()">全14ランクを一覧で見る</button>
    <div id="licensePreviewGallery" class="license-preview-gallery" hidden><div class="license-preview-note">デザイン確認用のサンプルです。実際の制覇数や訪問記録は変わりません。</div>${licensePreviewGallery()}</div>
   </section>
   <section class="card" style="margin-top:16px"><div class="stats"><div class="stat"><div class="sl">市区町村</div><div class="sn">${muniDone}</div></div><div class="stat"><div class="sl">行政区</div><div class="sn">${adminDone}</div></div><div class="stat"><div class="sl">訪問記録</div><div class="sn">${visits.length}</div></div></div></section><section class="card" style="margin-top:14px"><div class="cardtitle">現在のルール</div><div class="sub">その土地に降り立ち、何らかの行動をしたら制覇。交通機関などで通過しただけでは制覇になりません。</div><div class="note">写真は任意。写真なしでもユーザー申告で登録できます。ランキング機能は設けない方針です。</div><button class="btn" style="margin-top:15px" onclick="exportData()">記録をJSONで書き出す</button></section>`;
 }
}
function renderListResults(){
 const target=$("listResults");if(!target)return;
 const done=doneCodes();
 const arr=MUNICIPALITIES.filter(x=>(!q||(x.name+x.pref+x.county+x.code).includes(q))&&(!pref||x.pref===pref)&&(!kind||x.type===kind));
 const pages=Math.max(1,Math.ceil(arr.length/PAGE_SIZE));pageNo=Math.max(1,Math.min(pageNo,pages));
 const view=arr.slice((pageNo-1)*PAGE_SIZE,pageNo*PAGE_SIZE);
 target.innerHTML=`<div class="listhead"><div class="cardtitle" style="margin:0">対象一覧</div><div class="countsmall">${arr.length.toLocaleString()}件 · ${pageNo}/${pages}ページ</div></div>
 ${view.map(m=>`<div class="muni"><div class="ico ${done.has(m.code)?"done":""}">${done.has(m.code)?"✓":({"市":"市","町":"町","村":"村","特別区":"区","行政区":"区"}[m.type]||m.type)}</div><div><div class="mn">${esc(m.name)}</div><div class="mm">${esc(m.pref)}${m.county?" · "+esc(m.county):""} · ${esc(m.type)} · ${esc(m.code)}${m.parent?" · "+esc(m.parent)+"の行政区":""}</div></div><button class="action ${done.has(m.code)?"done":""}" onclick="openModal('${m.code}')">${done.has(m.code)?"✓ 訪問済み":"＋ 記録"}</button></div>`).join("")}
 <div class="pager"><button onclick="movePage(-1)" ${pageNo<=1?"disabled":""}>← 前へ</button><button onclick="movePage(1)" ${pageNo>=pages?"disabled":""}>次へ →</button></div>`;
}
function movePage(d){pageNo+=d;if(page==="list")renderListResults();else render();window.scrollTo(0,0)}
function openModal(code=""){
 $("modalback").classList.add("show");$("visitdate").value=new Date().toLocaleDateString("sv-SE");$("visitmemo").value="";$("visitphoto").value="";$("placeCode").value=code;
 const m=byCode(code);$("placeSearch").value=m?m.name:"";showPlaceResults(m?m.name:"");
}
function showPlaceResults(term){
 const box=$("placeResults"); if(!term){box.innerHTML=`<div class="note">自治体名を入力してください。</div>`;return}
 const a=MUNICIPALITIES.filter(x=>(x.name+x.pref+x.county+x.code).includes(term)).slice(0,12);
 box.innerHTML=a.map(x=>`<button type="button" class="action" style="display:block;width:100%;text-align:left;margin:4px 0" onclick="pickPlace('${x.code}')">${esc(x.name)} <span style="color:#718096">— ${esc(x.pref)} · ${esc(x.type)}</span></button>`).join("")||`<div class="note">候補がありません。</div>`;
}
function pickPlace(code){const m=byCode(code);$("placeCode").value=code;$("placeSearch").value=m.name;showPlaceResults(m.name)}
function closeModal(){$("modalback").classList.remove("show")}
function delVisit(id){if(confirm("この訪問記録を削除しますか？")){visits=visits.filter(x=>x.id!==id);saveLocal();render()}}
function exportData(){const b=new Blob([JSON.stringify({app:"1912CITIES",version:APP_VERSION,visits},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="1912cities-visits.json";a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{page=x.dataset.page;pageNo=1;render();window.scrollTo(0,0)});
$("close").onclick=closeModal;$("modalback").onclick=e=>{if(e.target===$("modalback"))closeModal()};
$("placeSearch").oninput=e=>{ $("placeCode").value=""; showPlaceResults(e.target.value) };
$("save").onclick=()=>{
 const code=$("placeCode").value,m=byCode(code),date=$("visitdate").value;
 if(!m){alert("自治体・行政区を候補から選択してください。");return}
 if(!date){alert("訪問日を入力してください。");return}
 visits.push({id:String(Date.now()),code,name:m.name,date,memo:$("visitmemo").value,verification:$("visitphoto").files.length?"photo":"self"});
 saveLocal();closeModal();render();
};
render();
</script>
<script>
(function(){
 const current=document.querySelector('meta[name="app-version"]').content;
 const banner=document.createElement("div");
 banner.id="updateBanner";
 banner.style.cssText="display:none;position:fixed;left:12px;right:12px;bottom:78px;z-index:100;background:#152238;color:white;border-radius:14px;padding:14px 16px;box-shadow:0 8px 28px #0004;align-items:center;gap:12px;justify-content:space-between;font-size:13px";
 banner.innerHTML='<span>新しいバージョンがあります</span><button type="button" id="updateNow" style="background:#fff;color:#152238;border:0;border-radius:9px;padding:10px 14px;font-weight:800;white-space:nowrap">更新する</button>';
 document.body.appendChild(banner);
 let latest=null,checking=false;
 async function checkUpdate(){
  if(checking||!navigator.onLine)return;
  checking=true;
  try{
   if("serviceWorker" in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}
   const response=await fetch("./index.html?version_check="+Date.now(),{cache:"no-store"});
   if(!response.ok)return;
   const page=await response.text();
   const found=page.match(/<meta name="app-version" content="([^"]+)"/);
   if(found&&found[1]!==current){latest=found[1];banner.style.display="flex"}
  }catch(e){console.warn("Update check failed",e)}
  finally{checking=false}
 }
 banner.querySelector("#updateNow").onclick=()=>{
  const url=new URL("./",location.href);
  url.searchParams.set("v",latest||Date.now());
  location.replace(url.href);
 };
 if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(()=>checkUpdate()).catch(()=>checkUpdate()));
 }else window.addEventListener("load",checkUpdate);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});
 window.addEventListener("pageshow",checkUpdate);
 setInterval(()=>{if(!document.hidden)checkUpdate()},180000);
})();
</script></body></html>
